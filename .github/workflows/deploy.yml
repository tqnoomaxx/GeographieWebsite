name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Ein PR darf keinen laufenden Release eines anderen Branches abbrechen.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pin the runner image so an ubuntu-latest migration cannot change the build underneath us.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Abhängigkeiten auf bekannte Schwachstellen prüfen
        run: npm audit --audit-level=high
      - name: Daten validieren
        run: npm run data:validate
      - name: Tests
        run: npm test
      - name: Build (GitHub Pages Projektseite)
        run: npm run release:check && npm run build
        env:
          VITE_BASE_URL: /${{ github.event.repository.name }}/
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_REGION: ${{ vars.VITE_SUPABASE_REGION }}
          VITE_SUPABASE_DPA_URL: ${{ vars.VITE_SUPABASE_DPA_URL }}
          VITE_LEGAL_NAME: ${{ vars.VITE_LEGAL_NAME }}
          VITE_LEGAL_ADDRESS: ${{ vars.VITE_LEGAL_ADDRESS }}
          VITE_LEGAL_EXTRA: ${{ vars.VITE_LEGAL_EXTRA }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
          VITE_HOSTING_PROVIDER: GitHub, Inc.
          VITE_HOSTING_PRIVACY_URL: https://docs.github.com/de/site-policy/privacy-policies/github-general-privacy-statement
      - name: Release-Build für Tests und Veröffentlichung sichern
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: E2E Smoke (${{ matrix.project }})
    needs: build
    runs-on: ubuntu-24.04
    # Installation und Tests haben eigene Budgets; anschließend bleibt Zeit für Fehlerberichte.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project: [mobile, desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unveränderten Release-Build laden
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-build
          path: dist/
      - name: Chromium für Browsertests installieren
        timeout-minutes: 15
        run: npx playwright install --with-deps --only-shell chromium
      - name: E2E Smoke
        # Playwright beendet sich nach 15 Minuten selbst und schreibt dabei noch die Reports.
        timeout-minutes: 17
        run: npx playwright test --project=${{ matrix.project }}
        env:
          PLAYWRIGHT_SKIP_BUILD: '1' # Genau den konfigurierten Release-Build testen und veröffentlichen.
          VITE_BASE_URL: /${{ github.event.repository.name }}/
      - name: Browserberichte und Fehler-Traces sichern
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Getesteten Release-Build laden
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-build
          path: dist/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
