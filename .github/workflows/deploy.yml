name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Daten validieren
        run: npm run data:validate
      - name: Tests
        run: npm test
      - name: Build (GitHub Pages Projektseite)
        run: npm run release:check && npm run build
        env:
          VITE_BASE_URL: /${{ github.event.repository.name }}/
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_REGION: ${{ vars.VITE_SUPABASE_REGION }}
          VITE_SUPABASE_DPA_URL: ${{ vars.VITE_SUPABASE_DPA_URL }}
          VITE_LEGAL_NAME: ${{ vars.VITE_LEGAL_NAME }}
          VITE_LEGAL_ADDRESS: ${{ vars.VITE_LEGAL_ADDRESS }}
          VITE_LEGAL_EXTRA: ${{ vars.VITE_LEGAL_EXTRA }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
          VITE_HOSTING_PROVIDER: GitHub, Inc.
          VITE_HOSTING_PRIVACY_URL: https://docs.github.com/de/site-policy/privacy-policies/github-general-privacy-statement
      - name: E2E Smoke
        run: npx playwright install --with-deps chromium && npx playwright test
        env:
          VITE_BASE_URL: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
