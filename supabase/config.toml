# Supabase-Projektkonfiguration. `supabase start` lokal, `supabase db push` remote.
project_id = "geokompass"

[api]
port = 54321
schemas = ["public"]
max_rows = 1000

[db]
port = 54322

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://tqnoomaxx.github.io/GeographieWebsite/**", "http://localhost:5173/**"]
enable_signup = true
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.rate_limit]
email_sent = 5
token_refresh = 60
sign_in_sign_ups = 10
token_verifications = 10

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "60s"
otp_length = 8
otp_expiry = 900

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.sessions]
timebox = "168h"
inactivity_timeout = "24h"

[functions.submit-session]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.export-account]
verify_jwt = true

# Feedback can be sent without an account. The function enforces CORS, validation and a durable rate limit.
[functions.feedback]
verify_jwt = false
