<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><title>Atlasfunke</title>
<script>
// GitHub Pages SPA-Fallback: Pfad in Query kodieren und zur Startseite umleiten (wird im Router zurückübersetzt).
(function () {
  var segments = location.pathname.split('/').filter(Boolean);
  var repoBase = document.querySelector('meta[name="gk-base"]');
  var base = repoBase ? repoBase.content : '/' + (segments.length && location.hostname.endsWith('github.io') ? segments[0] + '/' : '');
  var rest = location.pathname.slice(base.length);
  location.replace(base + '?p=' + encodeURIComponent('/' + rest + location.search) + location.hash);
})();
</script></head><body></body></html>
